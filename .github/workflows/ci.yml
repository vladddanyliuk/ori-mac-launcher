name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify launcher executable bit
        run: test -x ./ori

      - name: Syntax and contract tests
        run: bash ./tests/test.sh

      - name: ShellCheck
        run: shellcheck ori lib/*.sh tests/test.sh
